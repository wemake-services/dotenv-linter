# Flake8 configuration is kept here, since it is the only tool
# that does not support `pyproject.toml`.
# All other configuration lives in `pyproject.toml`.


[flake8]
format = wemake
show-source = true
doctests = true
statistics = false

# Plugins:
max-complexity = 6
max-line-length = 80

extend-exclude =
  .venv
  # Custom:
  dotenv_linter/grammar/parsetab.py

select = WPS

per-file-ignores =
  # Disable some rules for grammar definition:
  dotenv_linter/grammar/parser.py: WPS336
  dotenv_linter/grammar/lexer.py: WPS336
  # There are multiple assert`s, and subprocesses in tests:
  tests/*.py: WPS226
